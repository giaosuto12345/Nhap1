<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đếm Vật Thể - Thuật Toán Tách Dính (Distance Transform)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; color: #333; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls { background-color: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ced4da; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        input[type="file"] { padding: 12px; border: 2px dashed #3498db; width: 100%; cursor: pointer; color: #2980b9; font-weight: bold; }
        .canvas-wrapper { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        canvas { max-width: 48%; border: 1px solid #ccc; border-radius: 4px; background: #000; }
        .result { text-align: center; font-size: 1.8em; color: #fff; background-color: #2c3e50; padding: 15px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Thuật Toán Phân Tách Lõi Vật Thể</h2>
        
        <div class="controls">
            <div class="control-group">
                <input type="file" id="imageUpload" accept="image/*">
                <span id="statusMessage" style="color: #e67e22; font-weight: bold; display: block; margin-top:10px;">⏳ Đang tải thuật toán lõi...</span>
            </div>

            <div class="control-group">
                <label>1. Tách nền (Threshold): <span id="threshVal">180</span></label>
                <input type="range" id="threshold" min="0" max="255" value="180">
            </div>

            <div class="control-group">
                <label>2. Tách vật thể dính nhau (Tìm lõi): <span id="distVal">40</span>%</label>
                <input type="range" id="distThreshold" min="1" max="100" value="40">
                <small style="color: #555;">Kéo thanh này để "cắt" các tăm bông đang nằm sát nhau (Nhìn ảnh X-quang bên phải: Mỗi chấm trắng nhỏ sẽ tính là 1 vật thể).</small>
            </div>
        </div>

        <div class="result" id="resultCount">Số lõi đếm được: 0</div>

        <div class="canvas-wrapper">
            <div>
                <h4 style="text-align: center;">Kết Quả</h4>
                <canvas id="canvasOutput"></canvas>
            </div>
            <div>
                <h4 style="text-align: center;">Chụp X-Quang Tìm Lõi</h4>
                <canvas id="canvasFilter"></canvas>
            </div>
        </div>
    </div>

    <script>
        let imgElement = new Image();
        let isOpenCvReady = false;

        const imageUpload = document.getElementById('imageUpload');
        const thresholdSlider = document.getElementById('threshold');
        const distSlider = document.getElementById('distThreshold');

        var Module = {
            onRuntimeInitialized() {
                isOpenCvReady = true;
                document.getElementById('statusMessage').innerText = '✅ Hệ thống sẵn sàng!';
                document.getElementById('statusMessage').style.color = '#27ae60';
                if (imgElement.src) processImage();
            }
        };

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imgElement.src = event.target.result;
                    imgElement.onload = () => { if (isOpenCvReady) processImage(); }
                }
                reader.readAsDataURL(file);
            }
        });

        [thresholdSlider, distSlider].forEach(el => {
            el.addEventListener('input', () => {
                document.getElementById('threshVal').innerText = thresholdSlider.value;
                document.getElementById('distVal').innerText = distSlider.value;
                if (isOpenCvReady && imgElement.src) processImage();
            });
        });

        function processImage() {
            try {
                let srcMat = cv.imread(imgElement);
                let grayMat = new cv.Mat();
                let binaryMat = new cv.Mat();
                
                // Bước 1: Chuyển sang ảnh xám và tách nền
                cv.cvtColor(srcMat, grayMat, cv.COLOR_RGBA2GRAY);
                cv.threshold(grayMat, binaryMat, parseInt(thresholdSlider.value), 255, cv.THRESH_BINARY);

                // Bước 2: Distance Transform (Chụp X-quang tìm lõi)
                let distMat = new cv.Mat();
                cv.distanceTransform(binaryMat, distMat, cv.DIST_L2, 3);
                
                // Chuẩn hóa dải giá trị về 0-255 để dễ lọc
                cv.normalize(distMat, distMat, 0, 255, cv.NORM_MINMAX);
                distMat.convertTo(distMat, cv.CV_8U);

                // Bước 3: Lọc lấy các đỉnh núi (Lõi vật thể)
                let peaksMat = new cv.Mat();
                let peakThreshold = (parseInt(distSlider.value) / 100) * 255; 
                cv.threshold(distMat, peaksMat, peakThreshold, 255, cv.THRESH_BINARY);

                cv.imshow('canvasFilter', peaksMat);

                // Bước 4: Tìm và đếm số lõi
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(peaksMat, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let count = 0;
                for (let i = 0; i < contours.size(); ++i) {
                    let contour = contours.get(i);
                    // Lọc bỏ nhiễu hạt bụi quá nhỏ
                    if (cv.contourArea(contour) > 5) {
                        count++;
                        // Vẽ vòng tròn vào chính giữa tâm của tăm bông
                        let moments = cv.moments(contour);
                        let cx = moments.m10 / moments.m00;
                        let cy = moments.m01 / moments.m00;
                        cv.circle(srcMat, new cv.Point(cx, cy), 5, [231, 76, 60, 255], -1);
                    }
                }

                cv.imshow('canvasOutput', srcMat);
                document.getElementById('resultCount').innerText = `Số lõi đếm được: ${count}`;

                srcMat.delete(); grayMat.delete(); binaryMat.delete(); 
                distMat.delete(); peaksMat.delete(); contours.delete(); hierarchy.delete();
            } catch (err) {
                console.error("Lỗi thuật toán: ", err);
            }
        }
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/opencv.js@1.2.1/opencv.min.js"></script>
</body>
</html>
