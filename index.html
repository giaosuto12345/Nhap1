<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Vật Thể - Chống Nhiễu</title>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; color: #333; }
        h2 { text-align: center; color: #2c3e50; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls { background-color: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ced4da; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; margin-bottom: 10px; }
        input[type="file"] { padding: 12px; background: #fff; border: 2px dashed #3498db; border-radius: 6px; width: 100%; box-sizing: border-box; cursor: pointer; font-weight: bold; color: #2980b9; }
        #statusMessage { font-weight: bold; color: #e67e22; display: block; margin-top: 10px; font-size: 0.95em; }
        .canvas-wrapper { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .canvas-box { text-align: center; flex: 1; min-width: 320px; }
        canvas { max-width: 100%; border: 1px solid #ced4da; border-radius: 4px; background: #fff; min-height: 200px; }
        .result { text-align: center; font-size: 1.8em; color: #fff; background-color: #27ae60; padding: 15px; margin: 20px 0; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Hệ Thống Đếm Vật Thể (Bản Nâng Cấp)</h2>
    
    <div class="container">
        
        <div class="controls" id="controlsPanel">
            <div class="control-group">
                <label>1. Tải ảnh lên:</label>
                <input type="file" id="imageUpload" accept="image/*">
                <span id="statusMessage">⏳ Đang tải thư viện (Khoảng 8MB)...</span>
            </div>
            
            <div class="control-group">
                <label>2. Màu sắc vật thể:</label>
                <select id="objectType">
                    <option value="light">Vật thể SÁNG MÀU (Trắng, Vàng...) trên nền tối</option>
                    <option value="dark">Vật thể TỐI MÀU (Đen, Xám...) trên nền sáng</option>
                </select>
            </div>

            <div class="control-group">
                <label>3. Lọc sáng (Threshold): <span id="threshVal" style="color: #2980b9;">180</span></label>
                <input type="range" id="threshold" min="0" max="255" value="180">
            </div>

            <div class="control-group">
                <label>4. Lọc nhiễu kích thước: <span id="areaVal" style="color: #2980b9;">300</span> px²</label>
                <input type="range" id="minArea" min="0" max="5000" value="300" step="50">
            </div>
        </div>

        <div class="result" id="resultCount">Số vật thể đếm được: 0</div>

        <div class="canvas-wrapper">
            <div class="canvas-box">
                <h4>Kết Quả Quét</h4>
                <canvas id="canvasOutput"></canvas>
            </div>
            <div class="canvas-box">
                <h4>Lăng Kính AI (Trắng = Sẽ đếm)</h4>
                <canvas id="canvasFilter"></canvas>
            </div>
        </div>
    </div>

    <script>
        let imgElement = new Image();
        let srcMat, dstMat, grayMat;
        let isOpenCvReady = false;

        const imageUpload = document.getElementById('imageUpload');
        const objectType = document.getElementById('objectType');
        const thresholdSlider = document.getElementById('threshold');
        const minAreaSlider = document.getElementById('minArea');
        const threshVal = document.getElementById('threshVal');
        const areaVal = document.getElementById('areaVal');
        const statusMessage = document.getElementById('statusMessage');

        var Module = {
            onRuntimeInitialized() {
                isOpenCvReady = true;
                statusMessage.style.color = '#27ae60';
                statusMessage.innerText = '✅ Sẵn sàng! Hãy tải ảnh lên.';
                if (imgElement.src) processImage();
            }
        };

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imgElement.src = event.target.result;
                    imgElement.onload = () => {
                        if (isOpenCvReady) processImage();
                    }
                }
                reader.readAsDataURL(file);
            }
        });

        // Lắng nghe sự kiện thay đổi thanh trượt và dropdown
        [objectType, thresholdSlider, minAreaSlider].forEach(el => {
            el.addEventListener('input', () => {
                threshVal.innerText = thresholdSlider.value;
                areaVal.innerText = minAreaSlider.value;
                if (isOpenCvReady && imgElement.src) processImage();
            });
        });

        function processImage() {
            try {
                srcMat = cv.imread(imgElement);
                grayMat = new cv.Mat();
                dstMat = new cv.Mat();
                
                let thresholdValue = parseInt(thresholdSlider.value);
                let minAreaValue = parseInt(minAreaSlider.value);
                let isLightObj = objectType.value === 'light';

                // 1. Chuyển ảnh sang xám
                cv.cvtColor(srcMat, grayMat, cv.COLOR_RGBA2GRAY, 0);

                // 2. Làm mờ ảnh (Gaussian Blur) để xóa vân gỗ và nhiễu vải
                let ksize = new cv.Size(9, 9);
                cv.GaussianBlur(grayMat, grayMat, ksize, 0, 0, cv.BORDER_DEFAULT);

                // 3. Tách nền dựa trên tùy chọn màu sáng/tối
                let threshMethod = isLightObj ? cv.THRESH_BINARY : cv.THRESH_BINARY_INV;
                cv.threshold(grayMat, dstMat, thresholdValue, 255, threshMethod);
                
                cv.imshow('canvasFilter', dstMat);

                // 4. Tìm đường viền
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(dstMat, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let count = 0;

                for (let i = 0; i < contours.size(); ++i) {
                    let contour = contours.get(i);
                    let area = cv.contourArea(contour);

                    if (area > minAreaValue) {
                        count++;
                        let rect = cv.boundingRect(contour);
                        let point1 = new cv.Point(rect.x, rect.y);
                        let point2 = new cv.Point(rect.x + rect.width, rect.y + rect.height);
                        cv.rectangle(srcMat, point1, point2, [231, 76, 60, 255], 3);
                    }
                }

                cv.imshow('canvasOutput', srcMat);
                document.getElementById('resultCount').innerText = `Số vật thể đếm được: ${count}`;

                srcMat.delete(); grayMat.delete(); dstMat.delete(); contours.delete(); hierarchy.delete();
            } catch (err) {
                console.error("Lỗi: ", err);
            }
        }
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/opencv.js@1.2.1/opencv.min.js"></script>
</body>
</html>
