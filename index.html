<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Vật Thể Bằng AI (Client-side)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; color: #333; }
        h2 { text-align: center; color: #2c3e50; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls { text-align: center; margin-bottom: 20px; padding: 20px; border: 2px dashed #bdc3c7; border-radius: 8px; background-color: #ecf0f1; }
        input[type="file"] { margin-bottom: 15px; }
        button { padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 4px; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #loading { display: none; color: #e74c3c; font-weight: bold; margin-top: 10px; }
        .canvas-container { text-align: center; margin-top: 20px; overflow-x: auto; }
        canvas { max-width: 100%; border: 1px solid #ddd; border-radius: 4px; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 4px; }
        .result-box h3 { margin-top: 0; color: #16a085; }
        ul { list-style-type: none; padding: 0; }
        li { font-size: 1.1em; margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid #d1f2eb; }
    </style>
</head>
<body>

    <h2>Công Cụ Quét Và Đếm Vật Thể</h2>
    
    <div class="container">
        <div class="controls">
            <input type="file" id="imageUpload" accept="image/*">
            <br>
            <button id="detectBtn" disabled>Đang tải Engine AI...</button>
            <div id="loading">Đang phân tích hình ảnh, vui lòng đợi...</div>
        </div>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
        
        <div id="result" class="result-box" style="display: none;"></div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const detectBtn = document.getElementById('detectBtn');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        
        let model = undefined;
        let imgElement = new Image();

        // 1. Tải mô hình nhận diện khi trang web vừa tải xong
        cocoSsd.load().then(loadedModel => {
            model = loadedModel;
            detectBtn.innerText = 'Quét & Đếm';
            if (imageUpload.files.length > 0) detectBtn.disabled = false;
        });

        // 2. Xử lý khi người dùng upload ảnh
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imgElement.src = event.target.result;
                    imgElement.onload = () => {
                        // Vẽ ảnh gốc lên canvas
                        canvas.width = imgElement.width;
                        canvas.height = imgElement.height;
                        ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
                        
                        // Reset kết quả
                        resultDiv.style.display = 'none';
                        resultDiv.innerHTML = '';
                        
                        // Kích hoạt nút bấm nếu model đã tải xong
                        if (model) detectBtn.disabled = false;
                    }
                }
                reader.readAsDataURL(file);
            }
        });

        // 3. Thực thi quét và đếm vật thể
        detectBtn.addEventListener('click', async () => {
            if (!model || !imgElement.src) return;
            
            detectBtn.disabled = true;
            loadingDiv.style.display = 'block';
            resultDiv.style.display = 'none';

            // Vẽ lại ảnh gốc để xóa các bounding box của lần chạy trước (nếu có)
            ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);

            // Chạy Inference (Suy luận) từ canvas
            const predictions = await model.detect(canvas);
            
            // Khởi tạo biến đếm
            let objectCounts = {};
            let totalObjects = predictions.length;

            predictions.forEach(prediction => {
                // Đếm phân loại
                const className = prediction.class;
                objectCounts[className] = (objectCounts[className] || 0) + 1;

                // Lấy tọa độ hộp giới hạn (Bounding Box)
                const [x, y, width, height] = prediction.bbox;

                // Render viền đỏ bao quanh vật thể
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, width, height);

                // Render background cho text nhãn
                ctx.fillStyle = '#e74c3c';
                const text = `${className} (${Math.round(prediction.score * 100)}%)`;
                const textWidth = ctx.measureText(text).width;
                const textHeight = 16; 
                ctx.fillRect(x, y > textHeight ? y - textHeight - 4 : y, textWidth + 10, textHeight + 4);

                // Render text chữ trắng
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Arial';
                ctx.fillText(text, x + 5, y > textHeight ? y - 5 : y + 14);
            });

            // 4. Tổng hợp và in kết quả ra màn hình
            if (totalObjects > 0) {
                let resultHTML = `<h3>Tổng số vật thể đếm được: ${totalObjects}</h3><ul>`;
                // Sắp xếp và in số lượng từng nhóm vật thể giống nhau
                for (const [name, count] of Object.entries(objectCounts)) {
                    resultHTML += `<li><strong>${name}</strong>: ${count} vật thể</li>`;
                }
                resultHTML += '</ul>';
                resultDiv.innerHTML = resultHTML;
            } else {
                resultDiv.innerHTML = '<h3>Không tìm thấy vật thể nào rõ ràng trong ảnh.</h3>';
            }
            
            resultDiv.style.display = 'block';
            loadingDiv.style.display = 'none';
            detectBtn.disabled = false;
        });
    </script>
</body>
</html>
